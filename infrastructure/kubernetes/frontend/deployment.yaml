apiVersion: apps/v1
kind: Deployment

metadata:
  name: atlascore-frontend
  namespace: atlascore
  labels:
    app: atlascore-frontend

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: atlascore-frontend

  template:
    metadata:
      labels:
        app: atlascore-frontend

    spec:
      initContainers:
        - name: wait-for-backend
          image: curlimages/curl:latest

          command:
            - sh
            - -c
            - |
              until curl --fail --silent http://backend:8000/api/health;
              do
                echo "Waiting for backend..."
                sleep 2
              done

      containers:
        - name: frontend
          image: atlascore-frontend:k8s
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: frontend-config

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL